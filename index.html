<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kids Checkin • Login</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <link rel="icon" type="image/png" href="logo.png">
    <link rel="shortcut icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="application-name" content="Kids Checkin">
    <meta name="apple-mobile-web-app-title" content="Kids Checkin">
    <meta name="theme-color" content="#fcf7f5"> 
    <link rel="manifest" href="manifest.json">

    <script src="config.js"></script>
  
    <style>
        /* ===== Cores suaves (estilo Videira) ===== */
        :root {
            --primary: #8b5a6a;
            --primary-hover: #7a4d5a;
            --bg-color: #fcf7f5;
            --text-main: #4a3b3e;
            --text-light: #7a6a6e;
            --input-bg: #fdfaf9;
            --border-color: #e6dcd8;
            --danger-text: #b34a4a;
            --success-text: #2d6a4f;
            --accent: #d4a373;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            overflow: hidden;
            background: var(--bg-color);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        #tela-login {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: opacity 0.5s ease;
            padding: 0.5rem;
        }

        .card-login {
            background: #ffffff;
            padding: 2rem 1.5rem;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 380px;
            text-align: center;
            max-height: 95vh;
            overflow-y: auto;
            margin: 0 auto;
        }

        .logo {
            width: 90px;
            height: auto;
            margin-bottom: 12px;
            border-radius: 50%;
        }

        h2 {
            color: var(--primary);
            font-size: 1.3rem;
            margin-bottom: 4px;
            font-weight: 700;
        }

        p.subtitulo {
            color: var(--text-light);
            font-size: 0.85rem;
            margin-bottom: 1.8rem;
        }

        .input-group {
            margin-bottom: 1.2rem;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 0.7rem;
            color: var(--text-light);
            margin-bottom: 4px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        input[type="text"],
        input[type="password"],
        input[type="email"],
        input[type="tel"] {
            width: 100%;
            padding: 0.85rem 0.9rem;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            font-size: 0.95rem;
            color: var(--text-main);
            outline: none;
            transition: 0.3s;
            background-color: var(--input-bg);
            box-sizing: border-box;
            -webkit-appearance: none;
        }

        input:focus {
            border-color: var(--primary);
            background-color: #ffffff;
        }

        button {
            width: 100%;
            padding: 0.9rem;
            margin-top: 0.6rem;
            background-color: var(--primary);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            box-sizing: border-box;
        }

        button:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        button:disabled {
            background-color: #c9a7b3;
            cursor: not-allowed;
        }

        .btn-secondary {
            background-color: #ffffff;
            color: var(--primary);
            border: 2px solid var(--primary);
        }

        .btn-secondary:hover {
            background-color: #fdf8f6;
            transform: translateY(0);
        }

        .btn-link {
            background: none;
            border: none;
            color: var(--primary);
            font-size: 0.8rem;
            text-decoration: underline;
            cursor: pointer;
            padding: 4px;
            margin-top: 6px;
            width: 100%;
            display: inline-block;
        }

        .btn-link:hover {
            color: var(--primary-hover);
        }

        .mensagem-erro,
        .mensagem-sucesso {
            font-size: 0.85rem;
            margin-top: 1rem;
            padding: 0.6rem;
            border-radius: 8px;
            display: none;
            font-weight: 500;
            border: 1px solid transparent;
        }

        .mensagem-erro {
            color: var(--danger-text);
            background: #fdf0ee;
            border-color: #f5d6d2;
        }

        .mensagem-sucesso {
            color: var(--success-text);
            background: #d1e7dd;
            border-color: #b8d9c0;
        }

        #splash-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--bg-color);
            z-index: 5;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .splash-logo {
            width: 120px;
            animation: pulse 1.5s infinite ease-in-out;
        }

        #splash-screen p {
            margin-top: 25px;
            color: var(--text-main);
            font-size: 0.95rem;
            font-weight: 600;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        .bloco {
            display: none;
        }

        .bloco.ativo {
            display: block;
            animation: fadeIn 0.4s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Modal de escolha (parent/staff) */
        #modal-escolha {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        #modal-escolha .modal-box {
            background: white;
            padding: 2rem 1.8rem;
            border-radius: 20px;
            max-width: 340px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }

        #modal-escolha h3 {
            color: var(--primary);
            margin-top: 0;
            font-size: 1.2rem;
        }

        #modal-escolha p {
            color: var(--text-light);
            margin-bottom: 1.8rem;
            font-size: 0.9rem;
        }

        #modal-escolha .btn-escolha {
            display: block;
            width: 100%;
            padding: 0.9rem;
            margin-bottom: 0.7rem;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.2s;
        }

        #modal-escolha .btn-pai {
            background: var(--primary);
            color: white;
        }

        #modal-escolha .btn-pai:hover {
            background: var(--primary-hover);
        }

        #modal-escolha .btn-equipe {
            background: var(--accent);
            color: white;
        }

        #modal-escolha .btn-equipe:hover {
            background: #c4906a;
        }

        @media (max-width: 480px) {
            .card-login {
                padding: 1.5rem 1.2rem;
            }
            .logo {
                width: 70px;
            }
            h2 {
                font-size: 1.1rem;
            }
            input {
                padding: 0.7rem 0.8rem;
                font-size: 0.9rem;
            }
            button {
                padding: 0.75rem;
                font-size: 0.9rem;
            }
            #modal-escolha .modal-box {
                padding: 1.5rem 1.2rem;
            }
        }
    </style>
</head>
<body>

    <script>
        // Desregistra Service Workers antigos e limpa caches (se houver)
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for (let registration of registrations) {
                    registration.unregister();
                }
            });
        }
        if ('caches' in window) {
            caches.keys().then(function(names) {
                for (let name of names) caches.delete(name);
            });
        }
    </script>

    <!-- ===== TELA DE LOGIN ===== -->
    <div id="tela-login">
        <div class="card-login">

            <!-- Bloco Login -->
            <div id="bloco-login" class="bloco ativo">
                <img src="logo.png" class="logo" alt="Logo Kids">
                <h2 id="titulo-login">Domingo Kids</h2>
                <p class="subtitulo" id="subtitulo-login">Entre com seu usuário ou e-mail</p>

                <div id="area-form">
                    <div class="input-group">
                        <label>Usuário ou e-mail</label>
                        <input type="text" id="usuario-input" placeholder="Seu usuário ou e-mail" onkeypress="verificarEnter(event, 'login')" autocomplete="off">
                    </div>
                    <div class="input-group">
                        <label>Senha (Somente Números)</label>
                        <input type="password" id="senha-input" inputmode="numeric" pattern="[0-9]*" placeholder="••••••" onkeypress="verificarEnter(event, 'login')">
                    </div>

                    <button id="btn-entrar" onclick="verificarLogin()">Entrar</button>
                    <p id="mensagem-erro" class="mensagem-erro">⚠️ Usuário ou senha incorretos.</p>

                    <button class="btn-link" onclick="mudarTela('bloco-recuperar')">Esqueci minha senha</button>
                    <button class="btn-secondary" onclick="cadastrarPai()" style="margin-top: 12px; padding: 12px; font-size: 0.9rem;">Criar nova conta como Pai</button>
                </div>
            </div>

            <!-- Bloco Recuperar Senha -->
            <div id="bloco-recuperar" class="bloco">
                <img src="logo.png" style="width: 70px; border-radius: 50%; margin-bottom: 10px;" alt="Logo Kids">
                <h2>Recuperar Senha</h2>
                <p class="subtitulo" style="margin-bottom: 1.5rem;">Informe seu e-mail para receber o link.</p>

                <div class="input-group">
                    <label>Seu E-mail Cadastrado *</label>
                    <input type="email" id="rec-email" placeholder="Digite seu e-mail" onkeypress="verificarEnter(event, 'recuperar')">
                </div>

                <button id="btn-recuperar" onclick="enviarRecuperacao()">Enviar Link</button>
                <p id="mensagem-erro-rec" class="mensagem-erro"></p>

                <button class="btn-secondary" onclick="mudarTela('bloco-login')" style="margin-top: 12px; padding: 10px; font-size: 0.9rem;">Voltar para o Login</button>
            </div>

        </div>
    </div>

    <!-- ===== SPLASH SCREEN ===== -->
    <div id="splash-screen">
        <img src="logo.png" alt="Carregando" class="splash-logo">
        <p id="splash-texto">Autenticando e carregando...</p>
    </div>

    <!-- ===== MODAL DE ESCOLHA (parent / staff) ===== -->
    <div id="modal-escolha">
        <div class="modal-box">
            <h3>Olá, <span id="nome-usuario-escolha">usuário</span>!</h3>
            <p>Como você deseja acessar hoje?</p>
            <button class="btn-escolha btn-pai" onclick="escolherPapel('parent')">👨‍👩‍👧 Acessar como Pai</button>
            <button class="btn-escolha btn-equipe" onclick="escolherPapel('staff')">👥 Acessar como Equipe</button>
        </div>
    </div>

    <!-- ===== SCRIPTS ===== -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // ==================== CONFIGURAÇÃO ====================
        const supabaseClient = supabase.createClient(SB_URL, SB_KEY);

        // ==================== FUNÇÕES AUXILIARES ====================
        function mudarTela(idBloco) {
            document.querySelectorAll('.bloco').forEach(b => b.classList.remove('ativo'));
            document.getElementById(idBloco).classList.add('ativo');
            document.querySelectorAll('.mensagem-erro, .mensagem-sucesso').forEach(msg => msg.style.display = 'none');
        }

        function verificarEnter(event, contexto) {
            if (event.key === "Enter") {
                if (contexto === 'login') verificarLogin();
                else if (contexto === 'recuperar') enviarRecuperacao();
            }
        }

        function exibirErro(id, mensagem) {
            const el = document.getElementById(id);
            el.innerText = mensagem;
            el.style.display = 'block';
            el.style.color = 'var(--danger-text)';
            el.style.background = '#fdf0ee';
            el.style.borderColor = '#f5d6d2';
        }

        function exibirSucesso(mensagem) {
            const el = document.getElementById('mensagem-erro');
            el.style.color = 'var(--success-text)';
            el.style.background = '#d1e7dd';
            el.style.borderColor = '#b8d9c0';
            el.innerText = mensagem;
            el.style.display = 'block';
        }

        // ==================== CADASTRO DE PAI ====================
        async function cadastrarPai() {
            const email = document.getElementById('usuario-input').value.trim();
            const senha = document.getElementById('senha-input').value.trim();
            const erro = document.getElementById('mensagem-erro');

            if (!email || !senha) {
                exibirErro('mensagem-erro', 'Preencha e-mail e senha para criar sua conta.');
                return;
            }

            if (!email.includes('@')) {
                exibirErro('mensagem-erro', 'Digite um e-mail válido.');
                return;
            }

            if (senha.length < 6 || !/^\d+$/.test(senha)) {
                exibirErro('mensagem-erro', 'A senha deve ter 6 dígitos numéricos.');
                return;
            }

            const btn = document.getElementById('btn-entrar');
            btn.disabled = true;
            btn.innerText = 'Criando...';
            erro.style.display = 'none';

            try {
                const { data: authData, error: signUpError } = await supabaseClient.auth.signUp({
                    email: email,
                    password: senha,
                    options: {
                        data: {
                            full_name: 'Pai/Mãe',
                            role: 'parent'
                        }
                    }
                });

                if (signUpError) throw signUpError;

                const userId = authData.user.id;
                const { error: profileError } = await supabaseClient
                    .from('kids_profiles')
                    .insert({
                        id: userId,
                        role: 'parent'
                    });

                if (profileError && profileError.code !== '23505') {
                    throw profileError;
                }

                exibirSucesso('Conta criada com sucesso! Redirecionando...');
                setTimeout(() => {
                    window.location.href = 'pais.html?t=' + Date.now();
                }, 2000);

            } catch (err) {
                console.error(err);
                exibirErro('mensagem-erro', 'Erro ao criar conta: ' + err.message);
                btn.disabled = false;
                btn.innerText = 'Entrar';
            }
        }

        // ==================== LOGIN ====================
        async function verificarLogin() {
            const entrada = document.getElementById('usuario-input').value.trim();
            const senhaDigitada = document.getElementById('senha-input').value.trim();
            const erro = document.getElementById('mensagem-erro');
            const btn = document.getElementById('btn-entrar');

            if (!entrada || !senhaDigitada) {
                exibirErro('mensagem-erro', 'Preencha o usuário/e-mail e a senha.');
                return;
            }

            btn.innerText = "Autenticando...";
            btn.disabled = true;
            erro.style.display = 'none';

            try {
                let emailParaLogin = entrada;

                if (!entrada.includes('@')) {
                    const { data: profileData, error: profileErr } = await supabaseClient
                        .from('kids_profiles')
                        .select('email')
                        .ilike('username', entrada)
                        .maybeSingle();

                    if (profileErr || !profileData || !profileData.email) {
                        exibirErro('mensagem-erro', 'Usuário não encontrado.');
                        document.getElementById('senha-input').value = "";
                        btn.innerText = "Entrar";
                        btn.disabled = false;
                        return;
                    }

                    emailParaLogin = profileData.email;
                }

                const { data: loginData, error: loginError } = await supabaseClient.auth.signInWithPassword({
                    email: emailParaLogin,
                    password: senhaDigitada
                });

                if (loginError) {
                    exibirErro('mensagem-erro', 'Usuário/e-mail ou senha incorretos.');
                    document.getElementById('senha-input').value = "";
                    btn.innerText = "Entrar";
                    btn.disabled = false;
                    return;
                }

                const userId = loginData.user.id;

                const { data: profile, error: profileError } = await supabaseClient
                    .from('kids_profiles')
                    .select('role')
                    .eq('id', userId)
                    .maybeSingle();

                if (profileError || !profile) {
                    const { error: insertError } = await supabaseClient
                        .from('kids_profiles')
                        .insert({
                            id: userId,
                            role: 'parent'
                        });
                    if (insertError) {
                        exibirErro('mensagem-erro', 'Erro ao criar perfil. Contate o suporte.');
                        btn.innerText = "Entrar";
                        btn.disabled = false;
                        return;
                    }
                }

                // ===== LÓGICA DE REDIRECIONAMENTO =====
               const role = profile?.role || 'parent';

                if (role === 'admin') {
                    entrarNoPainel(loginData.user.user_metadata?.full_name || 'Admin', 'admin');
                } else if (role === 'staff') {
                    entrarNoPainel(loginData.user.user_metadata?.full_name || 'Equipe', 'equipe');
                } else if (role === 'parent') {
                    entrarNoPainel(loginData.user.user_metadata?.full_name || 'Pai', 'pais');
                } else if (role === 'both') {
                    // Mostrar modal de escolha
                    const nome = loginData.user.user_metadata?.full_name || 'usuário';
                    document.getElementById('nome-usuario-escolha').innerText = nome;
                    document.getElementById('modal-escolha').style.display = 'flex';
                    btn.innerText = "Entrar";
                    btn.disabled = false;
                } else {
                    // Fallback: redirecionar para pais
                    entrarNoPainel(loginData.user.user_metadata?.full_name || 'Pai', 'pais');
                }
    
                } catch (err) {
                    console.error('Erro no login:', err);
                    exibirErro('mensagem-erro', 'Erro inesperado. Tente novamente.');
                    btn.innerText = "Entrar";
                    btn.disabled = false;
                }
            }

        // ==================== ESCOLHER PAPEL (modal) ====================
        function escolherPapel(role) {
            const url = role === 'staff' ? 'equipe.html' : 'pais.html';
            document.getElementById('modal-escolha').style.display = 'none';
            entrarNoPainel('', url);
        }

        // ==================== ENTRAR NO PAINEL ====================
        function entrarNoPainel(nome, urlDestino) {
            const telaLogin = document.getElementById('tela-login');
            const splashScreen = document.getElementById('splash-screen');
            document.getElementById('splash-texto').innerText = `Carregando...`;

            telaLogin.style.opacity = '0';
            setTimeout(() => {
                telaLogin.style.display = 'none';
                splashScreen.style.display = 'flex';
                setTimeout(() => splashScreen.style.opacity = '1', 10);
                setTimeout(() => {
                    window.location.href = urlDestino + "?t=" + Date.now();
                }, 1000);
            }, 400);
        }

        // ==================== RECUPERAÇÃO DE SENHA ====================
        async function enviarRecuperacao() {
            const email = document.getElementById('rec-email').value.trim();
            const btn = document.getElementById('btn-recuperar');
            const erro = document.getElementById('mensagem-erro-rec');

            if (!email) {
                exibirErro('mensagem-erro-rec', 'Informe seu e-mail cadastrado.');
                return;
            }

            btn.innerText = "Processando...";
            btn.disabled = true;
            erro.style.display = 'none';

            try {
                const urlDestino = window.location.origin + "/sistema/nova-senha.html";
                const { data, error } = await supabaseClient.auth.resetPasswordForEmail(email, {
                    redirectTo: urlDestino,
                });
                if (error) throw error;

                exibirSucesso('E-mail de recuperação enviado! Verifique sua caixa de entrada.');
                document.getElementById('rec-email').value = "";
                mudarTela('bloco-login');
            } catch (e) {
                exibirErro('mensagem-erro-rec', 'Erro: ' + e.message);
            } finally {
                btn.innerText = "Enviar Link";
                btn.disabled = false;
            }
        }

        // ==================== INICIALIZAÇÃO ====================
        (async () => {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (user) {
                const { data: profile } = await supabaseClient
                    .from('kids_profiles')
                    .select('role')
                    .eq('id', user.id)
                    .maybeSingle();
                if (!profile) {
                    await supabaseClient.from('kids_profiles').insert({
                        id: user.id,
                        role: 'parent'
                    });
                }
                window.location.href = 'pais.html?t=' + Date.now()
            }
        })();
    </script>

</body>
</html>
